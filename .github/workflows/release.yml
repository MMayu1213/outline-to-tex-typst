name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-outline-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.4
      - run: npm ci
      - run: npm run check
      - name: Package installable plugin
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must be x.y.z"
            exit 1
          fi
          mkdir -p package/outline-to-tex-typst
          cp main.js manifest.json styles.css package/outline-to-tex-typst/
          (cd package && zip -r "../outline-to-tex-typst-${VERSION}.zip" outline-to-tex-typst)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            outline-to-tex-typst-*.zip
            RELEASE_NOTES.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - name: Publish version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must be x.y.z"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$VERSION" \
            main.js manifest.json styles.css "outline-to-tex-typst-${VERSION}.zip" \
            --target "$SOURCE_SHA" --title "$VERSION" --notes-file RELEASE_NOTES.md
